name: Verify prebuilt PDFium WASM
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest prebuilt WASM
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o pdfium-wasm.tgz https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-wasm.tgz
          mkdir pdfium
          tar -xzf pdfium-wasm.tgz -C pdfium
          find pdfium -maxdepth 3 -type f -print
      - name: Verify true text-editing exports
        run: |
          set -euxo pipefail
          grep -a -q "FPDFText_SetText" pdfium/lib/pdfium.js
          grep -a -q "FPDFPage_GenerateContent" pdfium/lib/pdfium.js
          grep -a -q "FPDFText_GetTextObject" pdfium/lib/pdfium.js
          grep -a -q "FPDFTextObj_GetText" pdfium/lib/pdfium.js
          echo "TRUE_TEXT_EDIT_EXPORTS=OK" | tee pdfium/verification.txt
      - name: Upload verified browser engine
        uses: actions/upload-artifact@v6
        with:
          name: pdftop-pdfium-wasm-verified
          path: pdfium/
          if-no-files-found: error
